[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-ai-v2-backend"
version = "0.1.0"
description = "FastAPI backend for Sonic AI V2 deterministic audio analysis."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.111.0,<0.112.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "gunicorn>=22.0.0,<23.0.0",
  "python-multipart>=0.0.9,<0.1.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "numpy>=2.2.0,<3.0.0",
  "scipy>=1.13.0,<2.0.0",
  "soundfile==0.12.1",
  "librosa>=0.10.2,<0.11.0",
  "pyloudnorm>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<0.28.0",
  "pytest>=8.2.0,<9.0.0",
  "ruff>=0.4.0,<0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
